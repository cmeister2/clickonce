name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a semantic release to crates.io and GitHub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.85.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc --all-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  msrv:
    name: Verify declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-msrv@0.19.6
      - run: cargo msrv verify

  coverage:
    name: Coverage and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  release-tools:
    name: Release tooling regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  success:
    name: Success
    if: always()
    needs: [rust, msrv, coverage, release-tools]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RELEASE_TOOLS_RESULT: ${{ needs.release-tools.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$MSRV_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$RELEASE_TOOLS_RESULT" = success

  release:
    name: Publish requested release
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.release &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [success]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
